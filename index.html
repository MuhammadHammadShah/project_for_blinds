<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Braille Mirror</title><meta name="description" content="Local English to Braille converter with mirrored printing."><link rel="stylesheet" href="style.css"></head><body><main><header><span class="logo" aria-hidden="true">⠃</span><h1>Braille Mirror</h1></header><section class="workspace"><article class="editor"><div class="panel-heading"><label for="input">Your text</label><button id="clear" class="text-button">Clear</button></div><textarea id="input" placeholder="Type or paste your text…&#10;&#10;Enter for a new line. Enter twice for a new paragraph." maxlength="50000" spellcheck="false"></textarea></article><article class="preview"><div class="panel-heading"><h2>Braille preview</h2><span id="page-count" aria-live="polite"></span></div><div class="switch" role="group" aria-label="Preview orientation"><button id="normal" class="selected" aria-pressed="true">Reading view</button><button id="mirror" aria-pressed="false">Mirrored view</button></div><div class="paper-scroll"><div id="screen-dots" class="dot-sheet" role="img" aria-label="Braille preview is empty"></div></div></article></section><div id="warning" role="alert" hidden></div><div class="actions"><button id="print" class="primary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z"/></svg>Print mirrored Braille</button></div></main><div id="print-sheet" aria-hidden="true"></div><script src="braille.js"></script><script src="app.js"></script></body></html>
